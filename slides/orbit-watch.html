<script>

let view=-1;const tabs=[];

 fe.appendChild(im);f.el=im;f.fe=fe;f.ok=null;im.onclick=()=>show(view===k?-1:k);

function show(k){view=k;big.style.display=k<0?'none':'block';if(k>=0)big.src=FEEDS[k].el.src;main.querySelector('.tab').textContent=k<0?'FEED_01 · ISS GROUND TRACK · DAY / NIGHT':FEEDS[k].id+' · '+FEEDS[k].name+' · CLICK AGAIN TO RETURN';FEEDS.forEach((f,i)=>f.fe.style.outline=i===k?'2px solid #e5322d':'none')}

const X=lo=>(lo+180)/360*cv.W,Y=la=>(90-la)/180*cv.H;

 x.beginPath();WORLD.forEach(([n,r])=>{r.forEach(([o,a],i)=>i?x.lineTo(X(o),Y(a)):x.moveTo(X(o),Y(a)));x.closePath()});x.fillStyle='rgba(230,231,234,.13)';x.fill();x.strokeStyle='rgba(230,231,234,.5)';x.lineWidth=.7;x.stroke();base=c;base.w=cv.W}

S.loop((t)=>{const x=cv.ctx,W=cv.W,H=cv.H;clk.textContent=new Date().toTimeString().slice(0,8);if(!base||base.w!==W)drawBase();x.drawImage(base,0,0);
 const s=sun(Date.now()),dr=s.lat*Math.PI/180;x.beginPath();for(let lo=-180;lo<=180;lo+=2){const la=Math.atan(-Math.cos((lo-s.lon)*Math.PI/180)/Math.tan(dr))*180/Math.PI;lo===-180?x.moveTo(X(lo),Y(la)):x.lineTo(X(lo),Y(la))}
 const pole=s.lat>0?-90:90;x.lineTo(X(180),Y(pole));x.lineTo(X(-180),Y(pole));x.closePath();x.fillStyle='rgba(0,0,0,.62)';x.fill();x.strokeStyle='rgba(255,210,122,.35)';x.lineWidth=1;x.stroke();
 S.glow(x,X(s.lon),Y(s.lat),22,'255,210,122',.2);S.tag(x,X(s.lon)+16,Y(s.lat)-14,'SUBSOLAR',{size:10});
 if(track.length>1){x.setLineDash([3,5]);x.lineWidth=1.2;let prev=null;const now=Date.now()/1000;track.forEach(p=>{const q=[X(p.lon),Y(p.lat)];x.strokeStyle=p.t<now?'rgba(230,231,234,.35)':'rgba(229,50,45,.75)';
