 info.innerHTML=`<b>NEAR ${near(la,lo)}</b><br>${la.toFixed(1)}°N ${(-lo).toFixed(1)}°W<br>${Math.round(samp('t',la,lo))}°F · HUMIDITY ${Math.round(samp('h',la,lo))}%<br>WIND ${Math.round(samp('s',la,lo))} MPH FROM ${S.astro.dir(fr).toUpperCase()} · GUSTS ${Math.round(samp('g',la,lo))}<br>CLOUD ${Math.round(samp('c',la,lo))}% · PRECIP ${samp('p',la,lo).toFixed(2)} IN/H`}
S.keys({' ':()=>run=!run});
S.loop((t,dt)=>{const x=cv.ctx,W=cv.W,H=cv.H;big.textContent=new Date().toTimeString().slice(0,5);
 if(!F){x.fillStyle=S.C.feed;x.fillRect(0,0,W,H);return}
 if(!base||base.layer!=layer+F)drawBase();if(trail.width!=W*1||trail.height!=H){trail.width=W;trail.height=H}
 const tx=trail.getContext('2d');tx.globalCompositeOperation='destination-out';tx.fillStyle='rgba(0,0,0,.035)';tx.fillRect(0,0,W,H);tx.globalCompositeOperation='source-over';
 if(!PT.length)PT=[...Array(NP)].map(seed);
 if(run){tx.lineWidth=1.3;PT.forEach(p=>{const la=LA(p[1]),lo=LO(p[0]),u=samp('u',la,lo),v=samp('v',la,lo),s=Math.hypot(u,v);
  const k=speed*.045*W/1000;const nx=p[0]+u*k,ny=p[1]-v*k*1/K*K;
  tx.strokeStyle=s>22?`rgba(229,50,45,.9)`:`rgba(240,242,245,${Math.min(.95,.35+s/18)})`;tx.beginPath();tx.moveTo(p[0],p[1]);tx.lineTo(nx,ny);tx.stroke();
  p[0]=nx;p[1]=ny;if(--p[2]<0||nx<0||ny<0||nx>W||ny>H){const q=seed();p[0]=q[0];p[1]=q[1];p[2]=40+Math.random()*60|0}})}
 x.fillStyle=S.C.feed;x.fillRect(0,0,W,H);x.drawImage(base,0,0);x.drawImage(trail,0,0);
 CITIES.forEach(([n,a,o])=>{const px=X(o),py=Y(a);S.reticle(x,px,py,6);x.fillStyle='#fff';x.fillRect(px-1.5,py-1.5,3,3);S.tag(x,px+10,py-10,n,{size:10})});
 if(mouse){S.reticle(x,mouse[0],mouse[1],14,S.C.red)}});
load();setInterval(load,15*60000);S.roll(P.el);
</script>
