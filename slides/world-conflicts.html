 sites:[['Bamako',12.64,-8.00,'capital, blockaded'],['Kati',12.74,-8.07,''],['Mopti',14.49,-4.20,''],['Kidal',18.44,1.41,'retaken by army']]},
{id:'hti',name:'Haiti',sub:'Gangs vs the Gang Suppression Force',lat:18.56,lon:-72.3,lvl:3,since:'2021 (GANG WAR)',parties:'Viv Ansanm gangs vs police, UN-backed GSF',status:'ACTIVE · FORCE UNDER ATTACK',
 kf:['70–90%','of Port-au-Prince controlled by gangs (estimates vary)'],
 b:['The UN-backed <b>Gang Suppression Force</b> (1,500–2,000 troops) was renewed for <b>six months</b>.','Raids in <b>Tabarre</b> and <b>Cité Soleil</b> on 5–6 Oct removed barricades.','19 Oct ambush: <b>four Salvadoran soldiers missing</b>; El Salvador sent reinforcements.','December <b>elections postponed</b> indefinitely.'],
 src:'CNN 19, 29 OCT · AL JAZEERA 29 SEP · UN NEWS',

];
const DWELL=15000,OVER=8000,FLY=2.8;
S.header(["CONFLICT MONITOR","V.11.02","UPDATED "+UPD],{status:'GLOBAL SURVEY'});
const st=document.querySelector('.s-hdr i');
document.getElementById('cnt').textContent=String(T.length).padStart(2,'0');
const items=document.getElementById('items');
T.forEach((t,i)=>{const d=S.el('div','it',`<span class=n>${String(i+1).padStart(2,'0')}</span><div>${t.name.toUpperCase()}<div class=k>${t.since.split(' · ')[0]}</div></div><div class=bar><i style="width:${t.lvl*20}%"></i></div>`);d.onclick=()=>go(i,true);items.appendChild(d)});
const dos=document.getElementById('dos');
function overviewBox(){dos.innerHTML=`<div class=a><span>SAMARITAN // GLOBAL ASSESSMENT</span><b>▲ ${T.length} ACTIVE</b></div>
<div class=t>Major active conflicts</div><div class=t2>Wars with fighting in the last 30 days</div>
<div class=kf><em>${T.filter(t=>t.lvl>=4).length}</em><span>theatres at high intensity: Ukraine, Iran and Hormuz, Sudan, Yemen–Saudi, Myanmar, eastern Congo, Mali</span></div>
<ul><li>The <b>Iran war</b> dominates: Hormuz has been <b>effectively shut</b> since spring and talks run through Qatar.</li>
<li>The <b>Russia–Ukraine</b> front is nearly frozen while both sides strike <b>energy targets</b>.</li>
<li><b>Sudan</b> remains the largest humanitarian crisis: over <b>10 million displaced</b>.</li>
<li>Smaller lists exist: UCDP counts <b>50–60 armed conflicts</b> in a typical year.</li></ul>
<div class=f><span>SURVEY BEGINS SHORTLY</span><span>UPDATED ${UPD}</span></div>`;S.roll(dos)}
function theatreBox(t,i){dos.innerHTML=`<div class=a><span>THEATRE ${String(i+1).padStart(2,'0')}/${T.length}</span><b>▲ ${t.lat.toFixed(1)}°, ${t.lon.toFixed(1)}°</b></div>
<div class=t>${t.name}</div><div class=t2>${t.sub}</div><span class=st>${t.status}</span>
<div class=g><span>SINCE</span><div>${t.since}</div><span>PARTIES</span><div>${t.parties}</div></div>
<div class=kf><em>${t.kf[0]}</em><span>${t.kf[1]}</span></div>
<ul>${t.b.map(x=>`<li>${x}</li>`).join('')}</ul>
<div class=f><span>SRC: ${t.src}</span><span>${UPD}</span></div>`;S.roll(dos)}
let map=null,marks=[],siteLayer=null,cur=-1,timer=0,t0=0,dur=OVER,paused=false;
const items_=()=>[...items.children];
function setOn(i){items_().forEach((e,k)=>e.classList.toggle('on',k===i));marks.forEach((m,k)=>{const e=m.getElement();if(e){e.firstChild.classList.toggle('on',k===i);e.firstChild.classList.toggle('dim',i>=0&&k!==i)}})}
function pad(){return{tl:[innerWidth*.215+30,innerHeight*.1],br:[innerWidth*.315+30,innerHeight*.1]}}
function overviewBounds(){return L.latLngBounds(T.map(t=>[t.lat,t.lon]))}
function go(i,manual){clearTimeout(timer);cur=i;setOn(i);
 if(i<0){overviewBox();st.textContent='▲ GLOBAL SURVEY';document.getElementById('mode').textContent='GLOBAL SURVEY';dur=OVER;
  if(map){if(siteLayer){map.removeLayer(siteLayer);siteLayer=null}const p=pad();map.flyToBounds(overviewBounds(),{paddingTopLeft:p.tl,paddingBottomRight:p.br,duration:FLY})}}
 else{const t=T[i];theatreBox(t,i);st.textContent="▲ TRACKING THEATRE "+String(i+1).padStart(2,"0");document.getElementById('mode').innerHTML='THEATRE <b>'+String(i+1).padStart(2,'0')+'</b> · '+t.name.toUpperCase();dur=DWELL;
  if(map){if(siteLayer){map.removeLayer(siteLayer);siteLayer=null}const b=L.latLngBounds(t.sites.map(s=>[s[1],s[2]]));const p=pad();
   map.flyToBounds(b,{paddingTopLeft:[p.tl[0]+60,p.tl[1]+60],paddingBottomRight:[p.br[0]+90,p.br[1]+60],duration:FLY,maxZoom:10});
   map.once('moveend',()=>{if(cur!==i)return;siteLayer=L.layerGroup().addTo(map);
    L.marker([t.lat,t.lon],{icon:L.divIcon({className:'rt',html:'<svg width=92 height=92 viewBox="0 0 92 92" fill=none stroke="#ffd27a" stroke-width=1.5><path d="M2 20V2h18M72 2h18v18M90 72v18H72M20 90H2V72"/><path d="M46 30v10M46 52v10M30 46h10M52 46h10" stroke="#e5322d"/></svg>',iconSize:[0,0]}),interactive:false}).addTo(siteLayer);
    t.sites.forEach((s,k)=>setTimeout(()=>{if(cur!==i||!siteLayer)return;const m=L.marker([s[1],s[2]],{icon:L.divIcon({className:'st-m',html:`<i class=d></i><div class=l>${s[0].toUpperCase()}${s[3]?`<small>${s[3]}</small>`:''}</div>`,iconSize:[0,0]}),interactive:false}).addTo(siteLayer);
     const l=m.getElement().querySelector('.l');S.roll(l)},250+k*260))})}}
 t0=performance.now();if(!paused)timer=setTimeout(next,dur+(map?FLY*1000:0))}
function next(){go(cur+1>=T.length?-1:cur+1)}
(function bar(){const pb=document.getElementById('pbi'),nx=document.getElementById('nx');const total=dur+(map?FLY*1000:0);const f=paused?0:Math.min(1,(performance.now()-t0)/total);pb.style.width=(f*100)+'%';
 const n=cur+1>=T.length?'OVERVIEW':T[cur+1].name.toUpperCase();nx.innerHTML=paused?'<b>PAUSED</b>':'NEXT: '+n+' · '+Math.max(0,Math.ceil(total*(1-f)/1000))+'S';requestAnimationFrame(bar)})();
addEventListener('keydown',e=>{if(e.key===' '){paused=!paused;if(paused)clearTimeout(timer);else{t0=performance.now();timer=setTimeout(next,dur)}e.preventDefault()}else if(e.key==='o'||e.key==='O')go(-1,true)});
S.leafletDark(document.getElementById('map'),{center:[22,25],zoom:2.4,zoomSnap:.1,minZoom:2}).then(m=>{map=m;
 T.forEach((t,i)=>{const s=6+t.lvl*2.2,r=26+t.lvl*12;const mk=L.marker([t.lat,t.lon],{icon:L.divIcon({className:'',html:`<div class=cm><i class=rg style="width:${r}px;height:${r}px"></i><i class="rg d" style="width:${r}px;height:${r}px"></i><i class=sq style="width:${s}px;height:${s}px"></i><span class="lb${t.id==='gza'?' lo':''}">${String(i+1).padStart(2,'0')} ${t.name.toUpperCase()}</span></div>`,iconSize:[0,0]})}).addTo(map);
  mk.on('click',()=>go(i,true));marks.push(mk)});
 const p=pad();map.fitBounds(overviewBounds(),{paddingTopLeft:p.tl,paddingBottomRight:p.br});go(-1)}).catch(()=>go(-1));
</script>
</body>
<script>addEventListener('keydown',e=>{if(e.key==='Escape')location.href='../'})</script>
