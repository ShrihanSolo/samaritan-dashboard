   while(ON(x,y)){const p=b[y*8+x];if(p!=='.'){if(isW(p)===byW&&ps.includes(p.toUpperCase()))return true;break}x+=a;y+=c}}
  return false};
 S.pseudo=()=>{const m=[],b=S.b,w=S.w;
  for(let i=0;i<64;i++){const p=b[i];if(!own(p,w))continue;const f=F(i),r=R(i),t=p.toUpperCase();
   if(t==='P'){const d=w?-1:1,r1=r+d,last=w?0:7,start=w?6:1;
    const add=(to,fl)=>{if(R(to)===last)for(const pr of'qrbn')m.push({f:i,t:to,pr,fl});else m.push({f:i,t:to,fl})};
    if(ON(f,r1)&&b[r1*8+f]==='.'){add(r1*8+f);if(r===start&&b[(r+2*d)*8+f]==='.')m.push({f:i,t:(r+2*d)*8+f,fl:'2'})}
    for(const df of[-1,1])if(ON(f+df,r1)){const to=r1*8+f+df;if(b[to]!=='.'&&!own(b[to],w))add(to);else if(to===S.ep)m.push({f:i,t:to,fl:'e'})}}
   else if(t==='N'||t==='K'){for(const[a,c]of(t==='N'?N:K))if(ON(f+a,r+c)){const to=(r+c)*8+f+a;if(!own(b[to],w))m.push({f:i,t:to})}
    if(t==='K'){const row=w?7:0,kc=w?'K':'k',qc=w?'Q':'q';
     if(i===row*8+4&&!S.attacked(i,!w)){
      if(S.cr.includes(kc)&&b[row*8+5]==='.'&&b[row*8+6]==='.'&&b[row*8+7]===(w?'R':'r')&&!S.attacked(row*8+5,!w)&&!S.attacked(row*8+6,!w))m.push({f:i,t:row*8+6,fl:'k'});
      if(S.cr.includes(qc)&&b[row*8+3]==='.'&&b[row*8+2]==='.'&&b[row*8+1]==='.'&&b[row*8]===(w?'R':'r')&&!S.attacked(row*8+3,!w)&&!S.attacked(row*8+2,!w))m.push({f:i,t:row*8+2,fl:'q'})}}}
   else{for(const[a,c]of(t==='B'?DB:t==='R'?DR:DB.concat(DR))){let x=f+a,y=r+c;
    while(ON(x,y)){const to=y*8+x;if(own(b[to],w))break;m.push({f:i,t:to});if(b[to]!=='.')break;x+=a;y+=c}}}}
  return m};
 S.make=mv=>{const b=S.b,p=b[mv.f],w=S.w;S.hist.push({b:b.slice(),w,cr:S.cr,ep:S.ep,half:S.half,full:S.full});
  const cap=b[mv.t]!=='.'||mv.fl==='e';b[mv.t]=mv.pr?(w?mv.pr.toUpperCase():mv.pr):p;b[mv.f]='.';
  if(mv.fl==='e')b[mv.t+(w?8:-8)]='.';
  if(mv.fl==='k'){b[mv.t-1]=b[mv.t+1];b[mv.t+1]='.'}if(mv.fl==='q'){b[mv.t+1]=b[mv.t-2];b[mv.t-2]='.'}
  S.ep=mv.fl==='2'?(mv.f+mv.t)/2:-1;
  const strip=(sq,ch)=>{if(mv.f===sq||mv.t===sq)S.cr=S.cr.replace(ch,'')};
  if(p==='K')S.cr=S.cr.replace('K','').replace('Q','');if(p==='k')S.cr=S.cr.replace('k','').replace('q','');
  strip(63,'K');strip(56,'Q');strip(7,'k');strip(0,'q');
  S.half=(p.toUpperCase()==='P'||cap)?0:S.half+1;if(!w)S.full++;S.w=!w};
 S.undo=()=>{const h=S.hist.pop();S.b=h.b;S.w=h.w;S.cr=h.cr;S.ep=h.ep;S.half=h.half;S.full=h.full};
 S.kingSq=w=>S.b.indexOf(w?'K':'k');
 S.inCheck=()=>S.attacked(S.kingSq(S.w),!S.w);
 S.legal=()=>S.pseudo().filter(mv=>{S.make(mv);const ok=!S.attacked(S.kingSq(!S.w),S.w);S.undo();return ok});
 const sqn=i=>'abcdefgh'[F(i)]+(8-R(i));S.sqn=sqn;
 S.uci=mv=>sqn(mv.f)+sqn(mv.t)+(mv.pr||'');
 S.fromUci=u=>S.legal().find(mv=>S.uci(mv)===u)||null;
 S.san=mv=>{const p=S.b[mv.f].toUpperCase();let s;
  if(mv.fl==='k')s='O-O';else if(mv.fl==='q')s='O-O-O';else{const cap=S.b[mv.t]!=='.'||mv.fl==='e';
   if(p==='P')s=(cap?'abcdefgh'[F(mv.f)]+'x':'')+sqn(mv.t)+(mv.pr?'='+mv.pr.toUpperCase():'');
   else{const amb=S.legal().filter(o=>o.t===mv.t&&o.f!==mv.f&&S.b[o.f]===S.b[mv.f]);let d='';
    if(amb.length){if(amb.every(o=>F(o.f)!==F(mv.f)))d='abcdefgh'[F(mv.f)];else if(amb.every(o=>R(o.f)!==R(mv.f)))d=''+(8-R(mv.f));else d=sqn(mv.f)}
    s=p+d+(cap?'x':'')+sqn(mv.t)}}
  S.make(mv);const ch=S.inCheck(),mate=ch&&S.legal().length===0;S.undo();return s+(mate?'#':ch?'+':'')};
 S.fen=()=>{let o='';for(let r=0;r<8;r++){let e=0;for(let f=0;f<8;f++){const p=S.b[r*8+f];if(p==='.')e++;else{if(e)o+=e;e=0;o+=p}}if(e)o+=e;if(r<7)o+='/'}
  return o+' '+(S.w?'w':'b')+' '+(S.cr||'-')+' '+(S.ep<0?'-':sqn(S.ep))+' '+S.half+' '+S.full};
 S.load=fen=>{const[pl,side,cr,ep,h,fu]=fen.split(' ');S.b=[];for(const ch of pl.replace(/\//g,''))if(/\d/.test(ch))S.b.push(...'.'.repeat(+ch));else S.b.push(ch);
  S.w=side==='w';S.cr=cr==='-'?'':cr;S.ep=ep==='-'?-1:(8-+ep[1])*8+'abcdefgh'.indexOf(ep[0]);S.half=+h||0;S.full=+fu||1;S.hist=[]};
 S.perft=d=>{if(!d)return 1;let n=0;for(const mv of S.legal()){S.make(mv);n+=S.perft(d-1);S.undo()}return n};
}


// ---------------------------------------------------------------- two-player networking (PeerJS / WebRTC)
// The page that opens without a #code is the HOST (white). Its URL becomes #CODE.h; the invite link is #CODE (black).
// The host registers the PeerJS id samchess-CODE; the guest connects to it. Moves travel directly between the browsers.
// The host binds the first guest's browser token and refuses everyone else, so only two people can play.
const PFX='samchess-',ALPH='abcdefghjkmnpqrstuvwxyz23456789',START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
let h=location.hash.slice(1),code=h.replace(/\.h$/,''),isHost=!h||h.endsWith('.h');
if(!h){code=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>ALPH[b%ALPH.length]).join('');history.replaceState(null,'','#'+code+'.h')}
const me=isHost?'w':'b',SKEY='samchess-'+code+'-'+me;
const tok=new URLSearchParams(location.search).get('tok')||localStorage.getItem('samchess-token')||(()=>{const t=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('samchess-token',t);return t})();
// test hook: a local test page can supply a stand-in Peer class; on the live site this is PeerJS
const PeerC=(()=>{try{if(parent!==window&&parent.MockPeer)return parent.MockPeer}catch(e){}return window.Peer})();
const C=new Chess(),bd=document.getElementById('bd'),GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
let ucis=[],sans=[],sel=null,last=null,flip=me==='b',over='',peer=null,conn=null,lastSeen=0,full=false,boundTok=localStorage.getItem(SKEY+'-guest');
const $=id=>document.getElementById(id);
function net(t,ok){$('net').textContent=t;$('net').className=ok?'ok':''}
const live=()=>conn&&conn.open;
function setHistory(list){C.load(START);ucis=[];sans=[];last=null;sel=null;over='';
 for(const u of list){const mv=C.fromUci(u);if(!mv)break;sans.push(C.san(mv));ucis.push(u);C.make(mv);last=mv}save();render()}
function save(){localStorage.setItem(SKEY,JSON.stringify(ucis))}
function send(o){if(live())try{conn.send(o)}catch(e){}}
function status(){const L=C.legal();over='';if(!L.length)over=C.inCheck()?('Checkmate. '+((C.w?'b':'w')===me?'You win!':'You lose.')):'Stalemate. Draw.';
 const mine=(C.w?'w':'b')===me;$('st').textContent=over||(mine?(C.inCheck()?'Check! Your move':'Your move'):"Opponent's move")}
function render(){bd.innerHTML='';const tg=sel===null?[]:C.legal().filter(m=>m.f===sel).map(m=>m.t),kc=C.inCheck()?C.kingSq(C.w):-1;
 for(let k=0;k<64;k++){const i=flip?63-k:k,p=C.b[i],d=document.createElement('div'),f=i&7,r=i>>3;
  d.className='sq '+((f+r)%2?'d':'l')+(last&&(i===last.f||i===last.t)?' last':'')+(i===sel?' sel':'')+(i===kc?' chk':'')+(tg.includes(i)?(p==='.'?' dot':' cap'):'');
  if(p!=='.'){d.textContent=GL[p.toUpperCase()];d.classList.add(p<'a'?'W':'B')}
  if(k%8===0){const c=document.createElement('span');c.className='co';c.style.cssText='left:4%;top:3%';c.textContent=8-r;d.appendChild(c)}
  if(k>=56){const c=document.createElement('span');c.className='co';c.style.cssText='right:5%;bottom:2%';c.textContent='abcdefgh'[f];d.appendChild(c)}
  d.onclick=()=>click(i);bd.appendChild(d)}
 $('mv').innerHTML=sans.reduce((s,m,j)=>s+(j%2?' '+m+'<br>':'<span class=n>'+(j/2+1)+'.</span>'+m),'');$('mv').scrollTop=1e9;
 const st0={P:8,N:2,B:2,R:2,Q:1},cnt=w=>Object.entries(st0).map(([t,n])=>GL[t].repeat(Math.max(0,n-C.b.filter(q=>q===(w?t:t.toLowerCase())).length))).join('');
 $('capw').textContent=cnt(false);$('capb').textContent=cnt(true);status()}
function play(mv){sans.push(C.san(mv));ucis.push(C.uci(mv));C.make(mv);last=mv;sel=null;save();render()}
function click(i){if(over||(C.w?'w':'b')!==me)return;
 if(!live()){net('Not connected: moves are paused until your opponent is back.');return}
 if(sel!==null){const mv=C.legal().filter(m=>m.f===sel&&m.t===i).sort((a,b)=>(b.pr==='q')-(a.pr==='q'))[0];
  if(mv){const n=ucis.length;play(mv);send({t:'move',uci:ucis[n],n});return}}
 const p=C.b[i];sel=(p!=='.'&&(p<'a')===(me==='w')&&sel!==i)?i:null;render()}
// messages between the two browsers
function onData(d){lastSeen=Date.now();if(!d||!d.t)return;
 if(d.t==='hello'&&isHost){
  if(boundTok&&boundTok!==d.tok){try{this.send({t:'full'})}catch(e){}setTimeout(()=>this.close(),300);return}
  boundTok=d.tok;localStorage.setItem(SKEY+'-guest',d.tok);
  if(conn&&conn!==this)try{conn.close()}catch(e){}conn=this;
  const g=d.uci||[];if(g.length>ucis.length&&ucis.every((u,j)=>g[j]===u))setHistory(g);   // guest is ahead (host lost its copy)
  send({t:'state',uci:ucis});net('Connected. You are White.',true);return}
 if(d.t==='state'&&!isHost){setHistory(d.uci||[]);net('Connected. You are Black.',true);return}
 if(d.t==='full'){full=true;net('This game already has two players. Ask for a new link.');try{this.close()}catch(e){}return}
 if(d.t==='move'){const mv=d.n===ucis.length&&(C.w?'w':'b')!==me?C.fromUci(d.uci):null;
  if(mv)play(mv);else if(isHost)send({t:'state',uci:ucis});else send({t:'hello',tok,uci:ucis});return}
 if(d.t==='new'){setHistory([]);return}}
function watch(c){c.on('data',d=>onData.call(c,d));c.on('close',()=>{if(conn===c){conn=null;lost()}})}
function lost(){if(full)return;net(isHost?'Opponent disconnected. They can rejoin with the same link.':'Connection lost. Reconnecting…');if(!isHost)setTimeout(join,3000)}
// heartbeat: WebRTC does not always report a dropped peer, so both sides ping and drop a silent connection after 12 s
setInterval(()=>{if(live()){send({t:'ping'});if(Date.now()-lastSeen>12000){const c=conn;conn=null;try{c.close()}catch(e){}lost()}}},4000);
function join(){if(full||live()||!peer||peer.destroyed)return;if(peer.disconnected){peer.reconnect();return}
 net('Connecting to game '+code+'…');const c=peer.connect(PFX+code,{reliable:true});
 c.on('open',()=>{conn=c;lastSeen=Date.now();c.send({t:'hello',tok,uci:ucis})});watch(c)}
function start(){if(!PeerC){net('Could not load PeerJS. Check the internet connection and reload.');return}
 peer=isHost?new PeerC(PFX+code):new PeerC();
 peer.on('open',()=>{if(isHost)net(boundTok?'Waiting for your opponent to reconnect…':'Waiting for an opponent. Send them the link.');else join()});
 peer.on('connection',c=>{if(!isHost){c.close();return}c.on('open',()=>{lastSeen=Date.now()});watch(c)});
 peer.on('disconnected',()=>{if(!peer.destroyed)setTimeout(()=>{try{peer.reconnect()}catch(e){}},2000)});
 peer.on('error',e=>{const t=e&&e.type;
  if(t==='unavailable-id'){net('Reclaiming the game code (this takes a few seconds after a reload)…');peer.destroy();setTimeout(start,4000)}
  else if(t==='peer-unavailable'){net('Waiting for the host to open the game…');setTimeout(join,3000)}
  else if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){net('Lost the PeerJS server ('+t+'). Retrying…');setTimeout(()=>{if(peer.disconnected&&!peer.destroyed)try{peer.reconnect()}catch(x){}},4000)}
  else net('Connection error: '+(t||e))})}
// controls
const link=location.href.split('#')[0]+'#'+code;$('link').value=link;if(!isHost)$('sharebox').style.display='none';
$('copy').onclick=()=>{const done=()=>{$('copy').textContent='COPIED';setTimeout(()=>$('copy').textContent='COPY',1500)};
 if(navigator.clipboard)navigator.clipboard.writeText(link).then(done,()=>{$('link').select();document.execCommand('copy');done()});else{$('link').select();document.execCommand('copy');done()}};
$('newg').onclick=()=>{if(!live()){net('Connect first: a new game has to start on both boards.');return}if(confirm('Start a new game for both players?')){setHistory([]);send({t:'new'})}};
$('flipb').onclick=()=>{flip=!flip;render()};
$('newl').onclick=()=>{if(confirm('Make a new game with a new link? The current game is left behind.'))location.href=location.href.split('#')[0]};
S.header(['CHESS','TWO PLAYER',isHost?'WHITE · HOST':'BLACK · GUEST'],{status:'PEER TO PEER'});
setHistory(JSON.parse(localStorage.getItem(SKEY)||'[]'));start();S.roll&&S.roll($('p'));
</script>
